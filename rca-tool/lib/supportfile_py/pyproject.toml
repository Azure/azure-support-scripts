[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "supportfile"
# Version is sourced dynamically from Cargo.toml (see [tool.maturin] below).
# In CI, the version in Cargo.toml is overwritten from the pushed git tag by
# .github/scripts/set-crate-version-from-tag.sh, so the wheel always matches
# the tag.
dynamic = ["version"]
description = "Supportfile library for support file analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
]

[tool.maturin]
bindings = "pyo3"
