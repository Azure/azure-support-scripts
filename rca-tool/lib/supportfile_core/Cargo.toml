[package]
name = "supportfile"
version = "0.1.0"
edition = "2021"
description = "Supportfile library core for support file analysis"
license = "MIT"
readme = "README.md"

[lib]
crate-type = ["rlib"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tar = "0.4"
# `liblzma` is a maintained fork of `xz2` that exposes the multi-threaded
# decoder (`lzma_stream_decoder_mt`) via `MtStreamBuilder`. Used by the
# `rca_cli` example to parallelize `.tar.xz` / `.txz` decompression.
liblzma = { version = "0.4", features = ["parallel"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[example]]
name = "rca_cli"
path = "examples/rca_cli.rs"
