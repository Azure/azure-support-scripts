[package]
name = "supportfile"
version = "0.1.1"
edition = "2021"
description = "Supportfile library core for support file analysis"
license = "MIT"
readme = "README.md"

[lib]
crate-type = ["rlib"]

# The `rca_cli` binary pulls in the archive + parallelism stack
# (`tar`, `liblzma`, `flate2`, `zip`, `rayon`, `crossbeam-channel`),
# all of which are optional dependencies activated by the `cli`
# feature.  Declare the binary explicitly with `required-features`
# so plain `cargo build` / `cargo test` / `cargo package` (no
# features) skip it instead of failing on unresolved imports.
[[bin]]
name = "rca_cli"
path = "src/bin/rca_cli.rs"
required-features = ["cli"]

[features]
default = []
# Enables the bundled `rca_cli` command-line analyzer. Pulled in automatically
# when building the binary target (see `required-features` below).
cli = [
    "dep:tar",
    "dep:liblzma",
    "dep:flate2",
    "dep:zip",
    "dep:rayon",
    "dep:crossbeam-channel",
]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Archive handling — only needed by the `rca_cli` binary. Kept optional so
# library consumers (WASM / PyO3) don't pull these in.
tar = { version = "0.4", optional = true }
# `liblzma` is a maintained fork of `xz2` that exposes the multi-threaded
# decoder (`lzma_stream_decoder_mt`) via `MtStreamBuilder`. Used by `rca_cli`
# to parallelize `.tar.xz` / `.txz` decompression.
liblzma = { version = "0.4", features = ["parallel"], optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
# Worker-pool parallelism for the `rca_cli` parser dispatch loop. The reader
# thread streams archive members; rayon workers run the regex-heavy parsers
# in parallel and the per-thread `ArchiveResults` are merged in `reduce`.
rayon = { version = "1", optional = true }
crossbeam-channel = { version = "0.5", optional = true }


