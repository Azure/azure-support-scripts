[package]
name = "supportfile-wasm"
version = "0.0.0"
edition = "2021"
description = "WASM bindings for the supportfile parser library, consumed by the Leptos web UI worker."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
supportfile = { path = "../supportfile_core" }
wasm-bindgen = "0.2"
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
