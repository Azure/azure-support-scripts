<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>RCA Tool - WASM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode">
    <button id="theme-toggle" aria-label="Toggle dark mode">
        <span id="theme-icon">THEME</span>
    </button>
    
    <div class="container">
        <h1>RCA Tool</h1>
                
        <div id="loading">
            <div>Loading WebAssembly module...</div>
            <div id="load-progress" class="text-muted" style="margin-top: 10px; font-size: 0.9em;"></div>
        </div>
        
        <!-- Simple file upload UI -->
        <div id="drop-zone">
            <h2>Drag and Drop Support File</h2>
            <p>Choose a .tar.gz or .tar.xz cluster file (hb_report, crm_report, supportconfig, or sosreport)</p>
            <p>Or a plain text console log file (.log)</p>
            <p style='font-size: 0.9em;'>Supports both gzip and XZ compression</p>
            <input type="file" id="file-input" accept=".txz,.tar.xz,.tar.gz,.tgz,.log" aria-label="Drag and drop support file (.tar.gz, .tar.xz, or .log)">
        </div>
        <pre id="output"></pre>
    </div>

    <script type="module">
        // Theme toggle functionality (light/dark/colorblind)
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        // Theme modes: 'dark', 'light', 'colorblind'
        let currentTheme = 'dark'; // Default
        
        function updateTheme() {
            // Remove all theme classes
            document.body.classList.remove('dark-mode', 'colorblind-mode');
            
            // Apply current theme
            if (currentTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.textContent = 'DARK';
                themeToggle.setAttribute('aria-label', 'Switch to color-blind friendly mode');
            } else if (currentTheme === 'colorblind') {
                document.body.classList.add('colorblind-mode');
                themeIcon.textContent = 'CB';
                themeToggle.setAttribute('aria-label', 'Switch to light mode');
            } else {
                // light mode (no class)
                themeIcon.textContent = 'LIGHT';
                themeToggle.setAttribute('aria-label', 'Switch to dark mode');
            }
            
            // Save preference
            localStorage.setItem('theme', currentTheme);
        }
        
        themeToggle.addEventListener('click', () => {
            // Cycle through themes: dark -> colorblind -> light -> dark
            if (currentTheme === 'dark') {
                currentTheme = 'colorblind';
            } else if (currentTheme === 'colorblind') {
                currentTheme = 'light';
            } else {
                currentTheme = 'dark';
            }
            updateTheme();
        });
        
        // Load saved preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme && ['dark', 'light', 'colorblind'].includes(savedTheme)) {
            currentTheme = savedTheme;
            updateTheme();
        } else {
            updateTheme(); // Apply default
        }
        
        // Check for debug mode via URL parameter (?debug=on or ?debug=true or ?debug=cluster or ?debug=host or ?debug=app)
        const urlParams = new URLSearchParams(window.location.search);
        const debugParam = urlParams.get('debug');
        let DEBUG_MODE = false;
        if (debugParam === 'on' || debugParam === 'true') {
            DEBUG_MODE = true;
            console.log('Debug mode enabled via URL parameter');
        } else if (debugParam === 'cluster') {
            DEBUG_MODE = 'cluster';
            console.log('Cluster debug mode enabled via URL parameter');
        } else if (debugParam === 'host') {
            DEBUG_MODE = 'host';
            console.log('Host debug mode enabled via URL parameter');
        } else if (debugParam === 'app') {
            DEBUG_MODE = 'app';
            console.log('App debug mode enabled via URL parameter');
        }
        
        let lzmaLoaded = false;
        let workerSupported = typeof Worker !== 'undefined';
        
        // Add file input and drag-drop handlers immediately
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const output = document.getElementById('output');
            
            // Handle file selection via input button
            if (fileInput) {
                fileInput.addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    output.textContent = `Processing ${file.name}...`;
                    
                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        const data = new Uint8Array(evt.target.result);
                        await window.processLargeXZFile(data, file.name, output);
                    };
                    reader.readAsArrayBuffer(file);
                });
            }
            
            // Handle drag-and-drop
            if (dropZone) {
                // Prevent default drag behaviors
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                    }, false);
                });
                
                // Highlight drop zone when dragging over it
                ['dragenter', 'dragover'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => {
                        const isDark = document.body.classList.contains('dark-mode');
                        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--dropzone-bg-active').trim();
                        const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--dropzone-border').trim();
                        dropZone.style.backgroundColor = bgColor;
                        dropZone.style.borderColor = borderColor;
                    }, false);
                });
                
                ['dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => {
                        dropZone.style.backgroundColor = '';
                        dropZone.style.borderColor = '';
                    }, false);
                });
                
                // Handle dropped files
                dropZone.addEventListener('drop', async (e) => {
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        const file = files[0];
                        output.textContent = `Processing ${file.name}...`;
                        
                        const reader = new FileReader();
                        reader.onload = async (evt) => {
                            const data = new Uint8Array(evt.target.result);
                            await window.processLargeXZFile(data, file.name, output);
                        };
                        reader.readAsArrayBuffer(file);
                    }
                }, false);
            }
        });
        
        // Load LZMA library asynchronously
        async function loadLZMA() {
            return new Promise((resolve, reject) => {
                if (window.LZMA) {
                    lzmaLoaded = true;
                    resolve();
                    return;
                }
                
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/lzma@2.3.2/src/lzma-min.js';
                script.onload = () => {
                    lzmaLoaded = true;
                    resolve();
                };
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // Process plain text console log files (no TAR, no compression)
        async function processPlainTextLog(textData, filename, outputElement) {
            console.log(`Processing plain text log: ${filename}`);
            
            outputElement.innerHTML = `<div class="progress-container">
                <p class="progress-title">Analyzing ${filename}...</p>
                <div class="progress-bar-wrapper">
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill" style="width: 50%"></div>
                    </div>
                    <p id="progress-text" class="progress-text">Processing console log...</p>
                </div>
            </div>`;
            
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            
            try {
                // Create worker for analysis
                const worker = new Worker('liblzma-streaming-worker.js?v=' + Date.now());
                const timeout = setTimeout(() => {
                    worker.terminate();
                    throw new Error('Analysis timeout');
                }, 60000); // 1 minute timeout for plain text
                
                const result = await new Promise((resolve, reject) => {
                    worker.onmessage = (e) => {
                        const msg = e.data;
                        
                        console.log('[Main] Received message from worker:', msg);
                        
                        if (msg.ready) {
                            console.log('[Main] Worker ready, setting debug mode...');
                            worker.postMessage({ command: 'set_debug', enabled: DEBUG_MODE });
                            
                            // Send plain text for analysis with synthetic filename
                            const syntheticFilename = filename.endsWith('.log') ? filename : filename + '.log';
                            worker.postMessage({
                                cmd: 'analyze_plaintext',
                                textData: textData.buffer,
                                filename: syntheticFilename
                            }, [textData.buffer]);
                            return;
                        }
                        
                        // Check success BEFORE progress (message can have both fields)
                        if (msg.success) {
                            console.log('[Main] Success message detected, resolving promise...');
                            clearTimeout(timeout);
                            worker.terminate();
                            resolve(msg.analysis);
                            return;
                        }
                        
                        if (msg.error) {
                            console.log('[Main] Error message detected:', msg.error);
                            clearTimeout(timeout);
                            worker.terminate();
                            reject(new Error(msg.error));
                            return;
                        }
                        
                        if (msg.progress !== undefined) {
                            progressFill.style.width = msg.progress + '%';
                            progressText.textContent = `Analyzing: ${msg.progress}%`;
                            return;
                        }
                        
                        console.log('[Main] Unhandled message type:', msg);
                    };
                    
                    worker.onerror = (err) => {
                        console.error('[Main] Worker error event:', err);
                        console.error('[Main] Error message:', err.message);
                        console.error('[Main] Error filename:', err.filename);
                        console.error('[Main] Error lineno:', err.lineno);
                        console.error('[Main] Error colno:', err.colno);
                        console.error('[Main] Error error:', err.error);
                        clearTimeout(timeout);
                        worker.terminate();
                        reject(new Error('Worker error: ' + (err.message || 'Unknown error') + 
                                        ' at ' + (err.filename || 'unknown') + ':' + (err.lineno || '?')));
                    };
                });
                
                progressFill.style.width = '100%';
                progressText.textContent = 'Analysis complete';
                
                // Format results
                const analysisHTML = formatStreamingAnalysis(result, textData.length, textData.length, filename);
                
                outputElement.innerHTML = `
                    <div style="text-align: left; max-width: 800px; margin: 0 auto;">
                        ${analysisHTML}
                    </div>
                `;
                
            } catch (err) {
                console.error('Plain text analysis failed:', err);
                outputElement.innerHTML = `
                    <div style="text-align: center; color: red;">
                        <h3>Analysis Failed</h3>
                        <p><strong>File:</strong> ${filename}</p>
                        <p><strong>Error:</strong> ${err.message}</p>
                    </div>
                `;
            }
        }
        
        // Load Pako library asynchronously for gzip decompression
        let pakoLoaded = false;
        async function loadPako() {
            return new Promise((resolve, reject) => {
                if (window.pako) {
                    pakoLoaded = true;
                    resolve();
                    return;
                }
                
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
                script.onload = () => {
                    pakoLoaded = true;
                    resolve();
                };
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // Unified wrapper for LZMA decompression supporting multiple build styles
        function lzmaDecompress(input, onFinish, onProgress) {
            if (!window.LZMA) {
                throw new Error('LZMA library not loaded');
            }

            // Case 1: Classic object with decompress function
            if (typeof window.LZMA.decompress === 'function') {
                return window.LZMA.decompress(input, onFinish, onProgress);
            }

            // Case 2: LZMA is a constructor returning instance with decompress
            if (typeof window.LZMA === 'function') {
                try {
                    const inst = new window.LZMA();
                    if (inst && typeof inst.decompress === 'function') {
                        return inst.decompress(input, onFinish, onProgress);
                    }
                } catch (e) {
                    console.warn('LZMA instantiation attempt failed:', e);
                }
            }

            // Case 3: Some builds expose an array-like structure (e.g., web worker helper)
            // Try to locate a function with expected arity
            if (typeof window.LZMA === 'object') {
                for (const key of Object.keys(window.LZMA)) {
                    const candidate = window.LZMA[key];
                    if (typeof candidate === 'function' && /decompress/i.test(key)) {
                        return candidate(input, onFinish, onProgress);
                    }
                }
            }

            console.error('Unable to find LZMA.decompress. LZMA keys:', Object.keys(window.LZMA || {}));
            throw new Error('Unsupported LZMA build: decompress function not found');
        }
        
        // Web Worker decompression (truly non-blocking)
                function decompressWithWorker(compressedData) {
            return new Promise((resolve, reject) => {
                console.log('Creating Web Worker for XZ decompression...');
                
                let worker;
                try {
                    worker = new Worker('./xz-worker.js?v=' + Date.now());
                } catch (e) {
                    reject(new Error(`Failed to create worker: ${e.message}`));
                    return;
                }
                
                const id = Date.now();
                let timeout = setTimeout(() => {
                    worker.terminate();
                    reject(new Error('Worker decompression timeout'));
                }, 300000); // 5 minute timeout
                
                worker.onmessage = function(e) {
                    const { id: responseId, success, result, error, progress } = e.data;
                    
                    if (responseId !== id) return;
                    
                    if (progress !== undefined) {
                        console.log(`Worker XZ decompression progress: ${progress}%`);
                        return;
                    }
                    
                    clearTimeout(timeout);
                    worker.terminate();
                    
                    if (success) {
                        console.log('Worker decompression completed successfully');
                        resolve(new Uint8Array(result));
                    } else {
                        console.error('Worker decompression failed:', error);
                        reject(new Error(error));
                    }
                };
                
                worker.onerror = function(error) {
                    console.error('[Main] Worker error event:', error);
                    console.error('[Main] Error message:', error.message);
                    console.error('[Main] Error filename:', error.filename);
                    console.error('[Main] Error lineno:', error.lineno);
                    console.error('[Main] Error details:', error);
                    clearTimeout(timeout);
                    worker.terminate();
                    reject(new Error('Worker error: ' + (error.message || 'Unknown error') + 
                                    ' at ' + (error.filename || 'unknown') + ':' + (error.lineno || '?')));
                };
                
                // Send data to worker with transferable object
                try {
                    // Clone data so original buffer remains usable for fallbacks
                    const clone = compressedData.slice(); // Uint8Array copy
                    worker.postMessage({
                        compressedData: clone.buffer,
                        id: id
                    }, [clone.buffer]);
                } catch (e) {
                    clearTimeout(timeout);
                    worker.terminate();
                    reject(new Error(`Failed to send data to worker: ${e.message}`));
                }
            });
        }
        
        // Process compressed TAR files (gzip or XZ) with actual decompression, or plain text console logs
        window.processLargeXZFile = async function(compressedData, filename, outputElement) {
            try {
                console.log(`Processing file: ${filename} (${compressedData.length} bytes)`);
                
                // Detect file format by magic bytes
                const isGzip = compressedData[0] === 0x1f && compressedData[1] === 0x8b;
                const isXZ = compressedData[0] === 0xfd && compressedData[1] === 0x37 && 
                            compressedData[2] === 0x7a && compressedData[3] === 0x58 && 
                            compressedData[4] === 0x5a && compressedData[5] === 0x00;
                
                // Check if it's plain text by looking for mostly printable ASCII in first 512 bytes
                // and absence of null bytes (which indicate binary)
                let isProbablyText = false;
                if (!isGzip && !isXZ) {
                    const sampleSize = Math.min(512, compressedData.length);
                    let printableCount = 0;
                    let hasNullByte = false;
                    
                    for (let i = 0; i < sampleSize; i++) {
                        const byte = compressedData[i];
                        if (byte === 0) {
                            hasNullByte = true;
                            break;
                        }
                        // Count printable ASCII (space to ~) and common whitespace (tab, newline, carriage return)
                        if ((byte >= 0x20 && byte <= 0x7e) || byte === 0x09 || byte === 0x0a || byte === 0x0d) {
                            printableCount++;
                        }
                    }
                    
                    // If >80% of sampled bytes are printable and no null bytes, it's probably text
                    isProbablyText = !hasNullByte && (printableCount / sampleSize) > 0.8;
                }
                
                let compressionType = 'unknown';
                if (isGzip) compressionType = 'gzip';
                else if (isXZ) compressionType = 'xz';
                else if (isProbablyText) compressionType = 'plaintext';
                
                console.log(`Detected format: ${compressionType}`);
                
                // Handle plain text console logs
                if (isProbablyText) {
                    return await processPlainTextLog(compressedData, filename, outputElement);
                }
                
                if (!isGzip && !isXZ) {
                    throw new Error(`Unknown file format. Expected XZ (.tar.xz), gzip (.tar.gz), or plain text (.log).`);
                }
                
                // Update UI to show decompression in progress
                outputElement.innerHTML = `<div class="progress-container">
                    <p class="progress-title">Decompressing ${filename} (${compressionType})...</p>
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill"></div>
                        </div>
                        <p id="progress-text" class="progress-text">Preparing...</p>
                    </div>
                </div>`;
                
                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                
                let decompressedData;
                let usedWorker = false;
                let workerPath = 'none';
                
                // Handle gzip decompression
                if (isGzip) {
                    try {
                        progressText.textContent = 'Loading gzip decompressor...';
                        await loadPako();
                        
                        progressText.textContent = 'Decompressing gzip...';
                        progressFill.style.width = '50%';
                        
                        console.log('Starting pako gzip decompression...');
                        decompressedData = pako.ungzip(compressedData);
                        
                        progressFill.style.width = '100%';
                        progressText.textContent = 'Gzip decompression complete';
                        console.log(`Gzip decompression completed: ${decompressedData.length} bytes`);
                        
                        // Now parse the TAR data using the streaming worker's analysis
                        const Worker = window.Worker;
                        const workerSupported = typeof Worker !== 'undefined';
                        
                        if (!workerSupported) {
                            throw new Error('Web Workers not supported - cannot analyze TAR archive');
                        }
                        
                        progressText.textContent = 'Analyzing TAR archive...';
                        
                        // Use streaming worker for analysis only (no decompression)
                        const streamingResult = await new Promise((resolve, reject) => {
                            const w = new Worker('liblzma-streaming-worker.js?v=' + Date.now());
                            const timeout = setTimeout(() => {
                                w.terminate();
                                reject(new Error('TAR analysis timeout after 5 minutes'));
                            }, 5 * 60 * 1000);
                            
                            let workerReady = false;
                            
                            w.onmessage = (e) => {
                                console.log('[Main] Received message from worker:', e.data);
                                const msg = e.data;
                                
                                // Handle worker ready signal
                                if (msg.ready) {
                                    workerReady = true;
                                    console.log('[Main] TAR analysis worker ready, setting debug mode...');
                                    
                                    // Set debug mode in worker
                                    w.postMessage({ command: 'set_debug', enabled: DEBUG_MODE });
                                    
                                    // Send TAR data for analysis
                                    const clone = decompressedData.slice();
                                    w.postMessage({ 
                                        cmd: 'analyze_tar', 
                                        tarData: clone.buffer
                                    }, [clone.buffer]);
                                    return;
                                }
                                
                                console.log('[Main] Checking message type:', {
                                    hasReady: 'ready' in msg,
                                    readyValue: msg.ready,
                                    hasProgress: 'progress' in msg,
                                    progressValue: msg.progress,
                                    hasError: 'error' in msg,
                                    hasSuccess: 'success' in msg,
                                    successValue: msg.success,
                                    successType: typeof msg.success
                                });
                                
                                // Check for success BEFORE progress to avoid early return
                                if (msg.success) {
                                    console.log('[Main] Worker success message received!');
                                    clearTimeout(timeout);
                                    w.terminate();
                                    console.log('[Main] Worker terminated');
                                    console.log('[Main] Analysis data:', msg.analysis);
                                    try {
                                        resolve({
                                            totalDecompressed: decompressedData.length,
                                            analysis: msg.analysis,
                                            streaming: true
                                        });
                                        console.log('[Main] Promise resolved successfully');
                                    } catch (err) {
                                        console.error('[Main] Error resolving promise:', err);
                                        reject(err);
                                    }
                                    return;
                                }
                                
                                if (msg.progress !== undefined) {
                                    progressText.textContent = `Analyzing: ${msg.progress}% (${msg.analysis ? msg.analysis.fileCount : 0} files found)`;
                                    return;
                                }
                                
                                if (msg.error) {
                                    clearTimeout(timeout);
                                    w.terminate();
                                    reject(new Error(msg.error));
                                    return;
                                }
                            };
                            
                            w.onerror = (err) => {
                                clearTimeout(timeout);
                                w.terminate();
                                reject(new Error('Worker error: ' + err.message));
                            };
                            
                            // Wait for worker to be ready before sending data
                            // (Worker will send ready signal, we set debug mode, then send TAR data)
                        });
                        
                        progressFill.style.width = '100%';
                        progressText.textContent = 'Analysis complete';
                        
                        console.log('[Main] Gzip analysis complete, formatting results...');
                        console.log('[Main] streamingResult:', streamingResult);
                        console.log('[Main] streamingResult.analysis:', streamingResult.analysis);
                        
                        const tarAnalysis = formatStreamingAnalysis(streamingResult.analysis, compressedData.length, decompressedData.length, filename);
                        
                        console.log('[Main] tarAnalysis HTML length:', tarAnalysis ? tarAnalysis.length : 0);
                        
                        outputElement.innerHTML = `
                            <div style="text-align: left; max-width: 800px; margin: 0 auto;">
                                ${tarAnalysis}
                            </div>
                        `;
                        
                        console.log('[Main] UI updated successfully');
                        
                        return; // Success - exit function
                        
                    } catch (gzipErr) {
                        console.error('Gzip decompression failed:', gzipErr);
                        outputElement.innerHTML = `
                            <div style="text-align: center; color: red;">
                                <h3>Gzip Decompression Failed</h3>
                                <p><strong>File:</strong> ${filename}</p>
                                <p><strong>Error:</strong> ${gzipErr.message}</p>
                            </div>
                        `;
                        return;
                    }
                }

                // XZ decompression path (existing code)

                // Try streaming decompression for large files (memory-efficient)
                async function tryStreamingWorker() {
                    return new Promise((resolve, reject) => {
                        if (!workerSupported) return reject(new Error('Workers not supported'));
                        try {
                            const w = new Worker('./liblzma-streaming-worker.js?v=' + Date.now());
                            let timeout = setTimeout(() => { 
                                w.terminate(); 
                                reject(new Error('Streaming worker timeout')); 
                            }, 1800000); // 30 minute timeout for very large files
                            
                            let lastUpdate = Date.now();
                            let workerReady = false;
                            let pendingWork = null;
                            
                            w.onmessage = (e) => {
                                const msg = e.data;
                                
                                // Worker ready signal
                                if (msg.ready) {
                                    workerReady = true;
                                    console.log('[Main] Streaming worker ready, setting debug mode and sending data...');
                                    
                                    // Set debug mode in worker
                                    w.postMessage({ command: 'set_debug', enabled: DEBUG_MODE });
                                    
                                    if (pendingWork) {
                                        w.postMessage(pendingWork, [pendingWork.compressedData]);
                                        pendingWork = null;
                                    }
                                    return;
                                }
                                
                                // Progress updates
                                if (msg.progress !== undefined) {
                                    const now = Date.now();
                                    // Throttle UI updates to every 100ms
                                    if (now - lastUpdate > 100) {
                                        progressFill.style.width = `${msg.progress}%`;
                                        progressText.textContent = `Streaming: ${msg.progress}% (${(msg.decompressed / 1024 / 1024).toFixed(1)} MB decompressed, ${msg.analysis.fileCount} files found)`;
                                        lastUpdate = now;
                                    }
                                    return;
                                }
                                
                                // Error
                                if (msg.error) {
                                    clearTimeout(timeout);
                                    w.terminate();
                                    reject(new Error(msg.error));
                                    return;
                                }
                                
                                // Success
                                if (msg.success) {
                                    clearTimeout(timeout);
                                    w.terminate();
                                    resolve({
                                        totalDecompressed: msg.totalDecompressed,
                                        analysis: msg.analysis,
                                        streaming: true
                                    });
                                }
                            };
                            
                            w.onerror = (err) => {
                                clearTimeout(timeout);
                                w.terminate();
                                reject(new Error('Worker error: ' + err.message));
                            };
                            
                            // Prepare work to send (will be sent after worker signals ready)
                            const clone = compressedData.slice();
                            pendingWork = { 
                                cmd: 'decompress_streaming', 
                                compressedData: clone.buffer,
                                chunkSize: 256 * 1024  // 256KB chunks
                            };
                            // Note: can't transfer buffer yet, will be done when worker is ready
                        } catch (e) { 
                            reject(e); 
                        }
                    });
                }

                // Attempt streaming decompression for all XZ files (memory-efficient)
                // Use streaming mode for any compressed XZ file, regardless of size
                const STREAMING_THRESHOLD = 0; // always use streaming
                let streamingResult = null;
                
                if (workerSupported && compressedData.length > STREAMING_THRESHOLD) {
                    try {
                        progressText.textContent = 'Starting streaming decompression (memory-efficient)...';
                        streamingResult = await tryStreamingWorker();
                        usedWorker = true;
                        workerPath = 'streaming';
                        progressFill.style.width = '100%';

        // Analyze TAR content from decompressed data
        async function analyzeTarContent(tarData) {
            return new Promise((resolve) => {
                try {
                    console.log('Analyzing TAR content:', tarData.length, 'bytes');
                    
                    let fileCount = 0;
                    let directories = [];
                    let importantFiles = [];
                    let fileTypes = {};
                    let offset = 0;
                    
                    // Parse TAR format
                    while (offset < tarData.length - 512) {
                        // Check if we've hit the end (two zero blocks)
                        if (tarData[offset] === 0 && tarData[offset + 1] === 0) {
                            let allZero = true;
                            for (let i = 0; i < 512; i++) {
                                if (tarData[offset + i] !== 0) {
                                    allZero = false;
                                    break;
                                }
                            }
                            if (allZero) break;
                        }
                        
                        // Read TAR header
                        let filename = '';
                        for (let i = 0; i < 100; i++) {
                            if (tarData[offset + i] === 0) break;
                            filename += String.fromCharCode(tarData[offset + i]);
                        }
                        
                        if (filename.length === 0) {
                            offset += 512;
                            continue;
                        }
                        
                        // Get file size (octal format in TAR)
                        let sizeStr = '';
                        for (let i = 124; i < 136; i++) {
                            if (tarData[offset + i] === 0 || tarData[offset + i] === 32) break;
                            sizeStr += String.fromCharCode(tarData[offset + i]);
                        }
                        
                        const size = parseInt(sizeStr, 8) || 0;
                        const fileType = tarData[offset + 156];
                        
                        fileCount++;
                        
                        // Categorize files
                        if (filename.endsWith('/')) {
                            directories.push(filename);
                        } else {
                            // Check for important files
                            const basename = filename.split('/').pop().toLowerCase();
                            if (basename.includes('config') || basename.includes('log') || 
                                basename.includes('version') || basename.includes('status') ||
                                basename === 'messages' || basename === 'syslog' ||
                                basename.includes('cluster') || basename.includes('pacemaker')) {
                                importantFiles.push({ name: filename, size: size });
                            }
                            
                            // Track file types
                            const ext = basename.split('.').pop();
                            fileTypes[ext] = (fileTypes[ext] || 0) + 1;
                        }
                        
                        // Move to next file (header + data, rounded up to 512 bytes)
                        const dataSize = Math.ceil(size / 512) * 512;
                        offset += 512 + dataSize;
                        
                        // Prevent infinite loops
                        if (fileCount > 10000) break;
                    }
                    
                    // Generate analysis report
                    const report = `
                        <p><strong>Total Files:</strong> ${fileCount}</p>
                        <p><strong>Directories:</strong> ${directories.length}</p>
                        
                        <h5>Key Directories (first 10):</h5>
                        <ul style="font-family: monospace; font-size: 0.9em;">
                            ${directories.slice(0, 10).map(dir => `<li>${dir}</li>`).join('')}
                        </ul>
                        
                        <h5>Important Files (first 15):</h5>
                        <ul style="font-family: monospace; font-size: 0.9em;">
                            ${importantFiles.slice(0, 15).map(file => 
                                `<li>${file.name} <span class="text-muted">(${(file.size / 1024).toFixed(1)} KB)</span></li>`
                            ).join('')}
                        </ul>
                        
                        <h5>File Types:</h5>
                        <ul style="font-size: 0.9em;">
                            ${Object.entries(fileTypes).slice(0, 10).map(([ext, count]) => 
                                `<li><strong>.${ext}:</strong> ${count} files</li>`
                            ).join('')}
                        </ul>
                    `;
                    
                    resolve(report);
                    
                } catch (error) {
                    console.error('TAR analysis error:', error);
                    resolve(`<p style="color: red;">TAR analysis failed: ${error.message}</p>`);
                }
            });
        }
        
        // JavaScript XZ decompression function that WASM can call
        window.decompressXZ = function(compressedData) {
            return new Promise(async (resolve, reject) => {
                try {
                    console.log(`JavaScript XZ decompression starting with ${compressedData.length} bytes`);
                    
        // For now, skip Web Worker and use chunked main thread processing
        console.log('Using chunked main thread decompression with yielding...');                                    // Load LZMA if needed
                if (!lzmaLoaded || !window.LZMA) {
                    console.log('LZMA library not ready, loading...');
                    await loadLZMA();
                }
                
                // Convert Uint8Array to Array if needed
                const inputArray = Array.from(compressedData);
                
                // Use chunked processing with setTimeout yields
                console.log('Starting chunked XZ decompression...');
                
                // Process in chunks to avoid blocking
                function processChunked() {
                    return new Promise((resolveChunk, rejectChunk) => {
                        // Use setTimeout to yield control
                        setTimeout(() => {
                            try {
                                lzmaDecompress(inputArray, function(result, error) {
                                    if (error) {
                                        console.error('Chunked XZ decompression failed:', error);
                                        rejectChunk(new Error(`Chunked XZ decompression failed: ${error}`));
                                    } else {
                                        console.log(`Chunked XZ decompression completed: ${result.length} bytes`);
                                        const uint8Result = new Uint8Array(result);
                                        resolveChunk(uint8Result);
                                    }
                                });
                            } catch (e) {
                                rejectChunk(e);
                            }
                        }, 50); // 50ms delay to yield control
                    });
                }
                
                // Execute chunked processing
                const result = await processChunked();
                resolve(result);
                    
                } catch (e) {
                    console.error('JavaScript XZ decompression exception:', e);
                    reject(e);
                }
            });
        };
        
        async function run() {
            const progressDiv = document.getElementById('load-progress');
            
            try {
                // Load compression libraries
                progressDiv.textContent = 'Loading compression libraries...';
                
                let loadingRemoved = false;
                const removeLoadingOnce = () => {
                    if (!loadingRemoved) {
                        const loadingElement = document.getElementById('loading');
                        if (loadingElement) {
                            loadingElement.remove();
                            loadingRemoved = true;
                        }
                    }
                };
                
                loadLZMA().then(() => {
                    console.log('LZMA library loaded successfully');
                    removeLoadingOnce();
                }).catch(error => {
                    console.error('Failed to load LZMA library:', error);
                    progressDiv.textContent = 'Warning: Compression library failed to load. XZ files may not work.';
                    removeLoadingOnce();
                });
                
                // Don't wait for LZMA - remove loading message after WASM attempt
                setTimeout(() => {
                    removeLoadingOnce();
                }, 500);
                
            } catch (error) {
                console.error('Failed to initialize:', error);
                progressDiv.textContent = 'Failed to initialize. Please check the console for errors.';
            }
        }
        
        // Start immediately but don't block the load event
        run();
    </script>
