[package]
name = "rca-tool-leptos"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "DragEvent",
    "DataTransfer",
    "Element",
    "ErrorEvent",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "ProgressEvent",
    "Storage",
    "Url",
    "UrlSearchParams",
    "Window",
    "Worker",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
log = "0.4"
console_log = { version = "0.2", features = ["color"] }
supportfile = { path = "../lib/supportfile_core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
