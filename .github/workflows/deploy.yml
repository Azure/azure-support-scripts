name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master, rca-tool ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 'latest'
        
    - name: Verify Emscripten installation
      run: |
        emcc --version
        
    - name: Build WASM module
      run: |
        cd rca-tool/liblzma-wasm
        chmod +x build-liblzma-streaming.sh
        ./build-liblzma-streaming.sh
        
    - name: Prepare deployment directory
      run: |
        cd rca-tool/
        mkdir -p _site
        # Copy HTML, CSS and worker JS from root
        cp index.html _site/
        cp styles.css _site/
        cp liblzma-streaming-worker.js _site/
        cp rca-utilities.js _site/
        # Copy built WASM files
        mkdir -p _site/liblzma-wasm/dist-streaming/
        cp liblzma-wasm/dist-streaming/liblzma-xz-streaming.js _site/liblzma-wasm/dist-streaming/
        cp liblzma-wasm/dist-streaming/liblzma-xz-streaming.wasm _site/liblzma-wasm/dist-streaming/
        cp README.md _site/ || true
        
    - name: List deployment files
      run: |
        echo "Files to be deployed:"
        ls -lh rca-tool/_site/
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'rca-tool/_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  post-deploy-test:
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Install dependencies
      run: npm ci
      working-directory: rca-tool/tests
      
    - name: Generate test fixtures
      run: |
        chmod +x create-fixtures.sh
        ./create-fixtures.sh
      working-directory: rca-tool/tests
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps msedge
      working-directory: rca-tool/tests
      
    - name: Wait for deployment to be ready
      run: |
        echo "Waiting 30 seconds for GitHub Pages to update..."
        sleep 30
        
    - name: Run post-deployment tests
      run: |
        # Run tests against the deployed site using the 'deployed' project
        npx playwright test --project=deployed --reporter=list
      working-directory: rca-tool/tests
      
    - name: Upload post-deployment test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: post-deploy-test-results
        path: rca-tool/tests/test-results/
        retention-days: 30
