name: Run Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          rca-tool/web-leptos -> target
          rca-tool/exploratory/lzma_stream_wasm -> target
          rca-tool/lib/supportfile_core -> target

    - name: Install Trunk
      uses: taiki-e/install-action@v2
      with:
        tool: trunk

    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: Build Rust CLI
      run: cargo build --locked --release --features cli --bin rca_cli
      working-directory: rca-tool/lib/supportfile_core
        
    - name: Build Leptos UI
      run: ./build.sh
      working-directory: rca-tool/web-leptos
    
    - name: Install test dependencies
      run: npm ci
      working-directory: rca-tool/tests

    - name: Building fixtures
      run: |
        chmod +x create-fixtures.sh
        ./create-fixtures.sh
      working-directory: rca-tool/tests
 
    - name: Install Playwright Edge
      run: npx playwright install --with-deps msedge
      working-directory: rca-tool/tests

    - name: Instrument source files for coverage
      run: bash instrument-coverage.sh
      working-directory: rca-tool/tests
      
    - name: Run Leptos web tests
      run: npx playwright test --config=playwright.leptos.config.js --project=local-leptos
      working-directory: rca-tool/tests
      
    - name: Run accessibility checks against Leptos
      run: |
        npx http-server ../ -p 8080 > /tmp/rca-tool-http-server.log 2>&1 &
        ACCESSIBILITY_URL=http://localhost:8080/web-leptos/dist/ node accessibility-check.js
      working-directory: rca-tool/tests
    
    - name: Test Rust CLI with all fixtures
      run: |
        # Test Rust CLI with all fixture files (excluding intentionally corrupted ones)
        failed=0
        total=0
        rust_cli="../lib/supportfile_core/target/release/rca_cli"
        if [[ ! -x "${rust_cli}" ]]; then
          echo "Rust CLI binary not found: ${rust_cli}"
          exit 1
        fi
        for fixture in fixtures/*.tar.xz; do
          # Skip intentionally corrupted test files
          if [[ "$fixture" == *"corrupted"* ]]; then
            echo "Skipping: $fixture (intentionally corrupted)"
            continue
          fi
          total=$((total + 1))
          echo "Testing: $fixture"
          if "${rust_cli}" "$fixture" > /dev/null 2>&1; then
            echo "  [OK] $fixture"
          else
            echo "  [FAIL] $fixture"
            failed=$((failed + 1))
          fi
        done
        echo ""
        echo "Rust CLI tests completed: $((total - failed))/$total passed"
        if [ $failed -gt 0 ]; then
          exit 1
        fi
      working-directory: rca-tool/tests
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          rca-tool/tests/playwright-report*/
          rca-tool/tests/test-results/
        retention-days: 30

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: rca-tool/tests/coverage-report*/
        retention-days: 30
