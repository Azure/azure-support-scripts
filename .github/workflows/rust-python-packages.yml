name: Rust and Python Package CI

'on':
  pull_request:
  push:
    branches:
      - main
      - master
      - rca-tool
    tags:
      - 'v*'
      - 'rust-parser-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_CORE_DIR: rca-tool/lib/supportfile_core
  RUST_MCP_DIR: rca-tool/lib/supportfile_mcp
  PY_PKG_DIR: rca-tool/lib/supportfile_py

jobs:
  build-rust-core:
    name: Build Rust core (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set crate versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: .github/scripts/set-crate-version-from-tag.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.RUST_CORE_DIR }} -> target
            ${{ env.RUST_MCP_DIR }} -> target
            ${{ env.PY_PKG_DIR }} -> target

      # sccache speeds up compilation on regular pushes/PRs. It is skipped on
      # release tag builds so that published crates/wheels come from clean,
      # uncached builds.
      - name: Restore sccache files
        id: restore-sccache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: rust-core-${{ runner.os }}-${{ matrix.arch }}-sccache-
          restore-keys: rust-core-${{ runner.os }}-${{ matrix.arch }}-sccache-

      - name: Install sccache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Configure sccache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          SCCACHE_PATH="$(command -v sccache)"
          SCCACHE_DIR="${GITHUB_WORKSPACE}/.sccache"
          mkdir -p "$SCCACHE_DIR"

          echo "Cache restore matched key: ${{ steps.restore-sccache.outputs.cache-matched-key }}"
          echo "Contents of SCCACHE_DIR ($SCCACHE_DIR):"
          ls -la "$SCCACHE_DIR" || echo "  (empty or missing)"
          du -sh "$SCCACHE_DIR" 2>/dev/null || true

          echo "SCCACHE_DIR=$SCCACHE_DIR" | tee -a "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" | tee -a "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" | tee -a "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" | tee -a "$GITHUB_ENV"

          SCCACHE_DIR="$SCCACHE_DIR" SCCACHE_CACHE_SIZE=2G "$SCCACHE_PATH" --start-server
          "$SCCACHE_PATH" --zero-stats || true
          "$SCCACHE_PATH" --show-stats || true

      - name: Build Rust crate
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Build rca_cli binary
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo build --locked --release --features cli --bin rca_cli --target "${{ matrix.rust_target }}"

      - name: Test Rust crate
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo test --locked --features cli --target "${{ matrix.rust_target }}"

      - name: Verify crate can be packaged
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo package --locked --allow-dirty

      - name: Build MCP server
        working-directory: ${{ env.RUST_MCP_DIR }}
        run: cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Test MCP server
        working-directory: ${{ env.RUST_MCP_DIR }}
        run: cargo test --locked --target "${{ matrix.rust_target }}"

      - name: Verify MCP crate can be packaged
        working-directory: ${{ env.RUST_MCP_DIR }}
        run: cargo package --locked --allow-dirty

      - name: Upload Rust crate artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-crate-${{ matrix.arch }}
          path: ${{ env.RUST_CORE_DIR }}/target/package/*.crate
          if-no-files-found: error
          retention-days: 14

      - name: Upload MCP crate artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-mcp-crate-${{ matrix.arch }}
          path: ${{ env.RUST_MCP_DIR }}/target/package/*.crate
          if-no-files-found: error
          retention-days: 14

      - name: Upload rca_cli binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rca_cli-${{ matrix.arch }}
          path: ${{ env.RUST_CORE_DIR }}/target/${{ matrix.rust_target }}/release/rca_cli
          if-no-files-found: error
          retention-days: 14

      - name: Upload supportfile_mcp binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: supportfile_mcp-${{ matrix.arch }}
          path: ${{ env.RUST_MCP_DIR }}/target/${{ matrix.rust_target }}/release/supportfile_mcp
          if-no-files-found: error
          retention-days: 14

      - name: Show sccache stats
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        run: sccache --show-stats || true

      - name: Prepare sccache files for saving
        id: prepare-save-sccache
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        run: echo "SCCACHE_TIMESTAMP=$(date -u +%F-%T)" | tee -a "$GITHUB_OUTPUT"

      - name: Save sccache files
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.restore-sccache.outputs.cache-primary-key }}${{ steps.prepare-save-sccache.outputs.SCCACHE_TIMESTAMP }}
          path: ${{ github.workspace }}/.sccache

  build-python-wheel:
    name: Build Python wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            maturin_target: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            maturin_target: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.maturin_target }}-unknown-linux-gnu

      - name: Set crate versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: .github/scripts/set-crate-version-from-tag.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PY_PKG_DIR }} -> target

      # Use PyO3/maturin-action which runs maturin inside a manylinux2014
      # Docker container. This produces wheels with a `manylinux_2_17_*`
      # (a.k.a. manylinux2014) platform tag, which PyPI accepts. Building
      # maturin directly on ubuntu-24.04 produces plain `linux_*` wheels
      # that PyPI rejects with HTTP 400 "unsupported platform tag".
      - name: Build wheel (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.maturin_target }}
          manylinux: '2014'
          working-directory: ${{ env.PY_PKG_DIR }}
          args: --release --out dist --strip

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.arch }}
          path: ${{ env.PY_PKG_DIR }}/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  # Publishing to external registries.
  # Wheels and crates are also uploaded as GitHub artifacts (see build-* jobs
  # above) for verification.

  publish-cargo:
    name: Publish Rust crate to crates.io
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-rust-core
      - build-python-wheel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set crate versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: .github/scripts/set-crate-version-from-tag.sh

      - name: Publish crate
        working-directory: ${{ env.RUST_CORE_DIR }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish MCP crate
        working-directory: ${{ env.RUST_MCP_DIR }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty --token "$CARGO_REGISTRY_TOKEN"

  publish-pypi:
    name: Publish Python wheels to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-python-wheel
    runs-on: ubuntu-24.04
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
