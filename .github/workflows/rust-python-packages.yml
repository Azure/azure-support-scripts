name: Rust and Python Package CI

'on':
  pull_request:
  push:
    branches:
      - main
      - master
      - rca-tool
    tags:
      - 'v*'
      - 'rust-parser-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_CORE_DIR: rca-tool/lib/supportfile_core
  PY_PKG_DIR: rca-tool/lib/supportfile_py

jobs:
  build-rust-core:
    name: Build Rust core (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.RUST_CORE_DIR }} -> target
            ${{ env.PY_PKG_DIR }} -> target

      - name: Build Rust crate
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Build rca_cli binary
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo build --locked --release --features cli --bin rca_cli --target "${{ matrix.rust_target }}"

      - name: Test Rust crate
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo test --locked --features cli --target "${{ matrix.rust_target }}"

      - name: Verify crate can be packaged
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo package --locked

      - name: Upload Rust crate artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-crate-${{ matrix.arch }}
          path: ${{ env.RUST_CORE_DIR }}/target/package/*.crate
          if-no-files-found: error
          retention-days: 14

      - name: Upload rca_cli binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rca_cli-${{ matrix.arch }}
          path: ${{ env.RUST_CORE_DIR }}/target/${{ matrix.rust_target }}/release/rca_cli
          if-no-files-found: error
          retention-days: 14

  build-python-wheel:
    name: Build Python wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            maturin_target: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            maturin_target: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.maturin_target }}-unknown-linux-gnu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PY_PKG_DIR }} -> target

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build wheel
        working-directory: ${{ env.PY_PKG_DIR }}
        run: maturin build --release --out dist --target ${{ matrix.maturin_target }}-unknown-linux-gnu --compatibility linux

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.arch }}
          path: ${{ env.PY_PKG_DIR }}/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  # Publishing to external registries.
  # Wheels and crates are also uploaded as GitHub artifacts (see build-* jobs
  # above) for verification.

  publish-cargo:
    name: Publish Rust crate to crates.io
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-rust-core
      - build-python-wheel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        working-directory: ${{ env.RUST_CORE_DIR }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

