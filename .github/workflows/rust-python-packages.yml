name: Rust and Python Package CI

'on':
  pull_request:
  push:
    branches:
      - main
      - master
      - rca-tool
    tags:
      - 'v*'
      - 'rust-parser-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_CORE_DIR: rca-tool/lib/supportfile_core
  RUST_MCP_DIR: rca-tool/lib/supportfile_mcp
  PY_PKG_DIR: rca-tool/lib/supportfile_py

jobs:
  build-rust-core:
    name: Build Rust core (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - os: macos
            arch: arm64
            runner: macos-26
            rust_target: aarch64-apple-darwin
          - os: windows
            arch: amd64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bin_ext: '.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set crate versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: .github/scripts/set-crate-version-from-tag.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.RUST_CORE_DIR }} -> target
            ${{ env.RUST_MCP_DIR }} -> target
            ${{ env.PY_PKG_DIR }} -> target

      # sccache speeds up compilation on regular pushes/PRs. It is skipped on
      # release tag builds so that published crates/wheels come from clean,
      # uncached builds.
      # sccache is configured through a POSIX shell script and is skipped on
      # Windows runners (which default to PowerShell); Swatinem/rust-cache still
      # provides cross-platform caching there.
      - name: Restore sccache files
        id: restore-sccache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache
          key: rust-core-${{ runner.os }}-${{ matrix.arch }}-sccache-
          restore-keys: rust-core-${{ runner.os }}-${{ matrix.arch }}-sccache-

      - name: Install sccache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows' }}
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Configure sccache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows' }}
        run: |
          set -euo pipefail
          SCCACHE_PATH="$(command -v sccache)"
          SCCACHE_DIR="${GITHUB_WORKSPACE}/.sccache"
          mkdir -p "$SCCACHE_DIR"

          echo "Cache restore matched key: ${{ steps.restore-sccache.outputs.cache-matched-key }}"
          echo "Contents of SCCACHE_DIR ($SCCACHE_DIR):"
          ls -la "$SCCACHE_DIR" || echo "  (empty or missing)"
          du -sh "$SCCACHE_DIR" 2>/dev/null || true

          echo "SCCACHE_DIR=$SCCACHE_DIR" | tee -a "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" | tee -a "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" | tee -a "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" | tee -a "$GITHUB_ENV"

          SCCACHE_DIR="$SCCACHE_DIR" SCCACHE_CACHE_SIZE=2G "$SCCACHE_PATH" --start-server
          "$SCCACHE_PATH" --zero-stats || true
          "$SCCACHE_PATH" --show-stats || true

      - name: Build Rust crate
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Build rca_cli binary
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo build --locked --release --features cli --bin rca_cli --target "${{ matrix.rust_target }}"

      - name: Test Rust crate
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo test --locked --features cli --target "${{ matrix.rust_target }}"

      - name: Verify crate can be packaged
        if: matrix.os == 'linux'
        working-directory: ${{ env.RUST_CORE_DIR }}
        run: cargo package --locked --allow-dirty

      - name: Build MCP server
        working-directory: ${{ env.RUST_MCP_DIR }}
        run: cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Test MCP server
        working-directory: ${{ env.RUST_MCP_DIR }}
        run: cargo test --locked --target "${{ matrix.rust_target }}"

      - name: Verify MCP crate can be packaged
        if: matrix.os == 'linux'
        working-directory: ${{ env.RUST_MCP_DIR }}
        run: cargo package --locked --allow-dirty

      # The `.crate` source packages are platform-independent, so they are only
      # uploaded from the Linux builds. The compiled binaries below are produced
      # for every OS/arch in the matrix (Linux + macOS).
      - name: Upload Rust crate artifact
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-crate-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.RUST_CORE_DIR }}/target/package/*.crate
          if-no-files-found: error
          retention-days: 14

      - name: Upload MCP crate artifact
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-mcp-crate-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.RUST_MCP_DIR }}/target/package/*.crate
          if-no-files-found: error
          retention-days: 14

      - name: Upload rca_cli binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rca_cli-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.RUST_CORE_DIR }}/target/${{ matrix.rust_target }}/release/rca_cli${{ matrix.bin_ext }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload supportfile_mcp binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: supportfile_mcp-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.RUST_MCP_DIR }}/target/${{ matrix.rust_target }}/release/supportfile_mcp${{ matrix.bin_ext }}
          if-no-files-found: error
          retention-days: 14

      - name: Show sccache stats
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows' }}
        run: sccache --show-stats || true

      - name: Prepare sccache files for saving
        id: prepare-save-sccache
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows' }}
        run: echo "SCCACHE_TIMESTAMP=$(date -u +%F-%T)" | tee -a "$GITHUB_OUTPUT"

      - name: Save sccache files
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows' }}
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.restore-sccache.outputs.cache-primary-key }}${{ steps.prepare-save-sccache.outputs.SCCACHE_TIMESTAMP }}
          path: ${{ github.workspace }}/.sccache

  build-python-wheel:
    name: Build Python wheel (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            maturin_target: x86_64
            rust_target: x86_64-unknown-linux-gnu
            manylinux: '2014'
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            maturin_target: aarch64
            rust_target: aarch64-unknown-linux-gnu
            manylinux: '2014'
          - os: macos
            arch: arm64
            runner: macos-26
            maturin_target: aarch64
            rust_target: aarch64-apple-darwin
            manylinux: 'auto'
          - os: windows
            arch: amd64
            runner: windows-latest
            maturin_target: x64
            rust_target: x86_64-pc-windows-msvc
            manylinux: 'auto'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set crate versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: .github/scripts/set-crate-version-from-tag.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PY_PKG_DIR }} -> target

      # Use PyO3/maturin-action which, for Linux targets, runs maturin inside a
      # manylinux2014 Docker container. This produces wheels with a
      # `manylinux_2_17_*` (a.k.a. manylinux2014) platform tag, which PyPI
      # accepts. Building maturin directly on ubuntu-24.04 produces plain
      # `linux_*` wheels that PyPI rejects with HTTP 400 "unsupported platform
      # tag". For macOS targets the `manylinux` input is ignored and maturin
      # builds native `macosx_*` wheels.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.maturin_target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: ${{ env.PY_PKG_DIR }}
          args: --release --out dist --strip

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.PY_PKG_DIR }}/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  build-vscode-extension:
    name: Package VS Code extension (${{ matrix.vsce_target }})
    needs:
      - build-rust-core
    runs-on: ubuntu-latest
    env:
      EXT_DIR: rca-tool/vscode-extension
    strategy:
      fail-fast: false
      matrix:
        include:
          # Map each VS Code platform target to the binary artifacts produced by
          # build-rust-core (named rca_cli-<os>-<arch> / supportfile_mcp-<os>-<arch>).
          - vsce_target: linux-x64
            artifact_suffix: linux-amd64
            bin_ext: ''
          - vsce_target: linux-arm64
            artifact_suffix: linux-arm64
            bin_ext: ''
          - vsce_target: darwin-arm64
            artifact_suffix: macos-arm64
            bin_ext: ''
          - vsce_target: win32-x64
            artifact_suffix: windows-amd64
            bin_ext: '.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Download rca_cli binary
        uses: actions/download-artifact@v5
        with:
          name: rca_cli-${{ matrix.artifact_suffix }}
          path: dl-rca

      - name: Download supportfile_mcp binary
        uses: actions/download-artifact@v5
        with:
          name: supportfile_mcp-${{ matrix.artifact_suffix }}
          path: dl-mcp

      # Place the platform binaries where the extension expects them (bin/).
      # The extension restores the Unix executable bit at runtime, so the bit
      # not surviving the VSIX is fine.
      - name: Stage platform binaries
        run: |
          set -euo pipefail
          mkdir -p "$EXT_DIR/bin"
          cp "dl-rca/rca_cli${{ matrix.bin_ext }}" "$EXT_DIR/bin/rca_cli${{ matrix.bin_ext }}"
          cp "dl-mcp/supportfile_mcp${{ matrix.bin_ext }}" "$EXT_DIR/bin/supportfile_mcp${{ matrix.bin_ext }}"
          ls -la "$EXT_DIR/bin"

      - name: Install extension dependencies
        working-directory: ${{ env.EXT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Type-check and bundle
        working-directory: ${{ env.EXT_DIR }}
        run: |
          npm run lint
          npm run package

      - name: Package VSIX
        working-directory: ${{ env.EXT_DIR }}
        run: |
          npx --yes @vscode/vsce package \
            --target ${{ matrix.vsce_target }} \
            --no-dependencies \
            --out "rca-tool-${{ matrix.vsce_target }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-${{ matrix.vsce_target }}
          path: ${{ env.EXT_DIR }}/rca-tool-${{ matrix.vsce_target }}.vsix
          if-no-files-found: error
          retention-days: 14

  # Publishing to external registries.
  # Wheels and crates are also uploaded as GitHub artifacts (see build-* jobs
  # above) for verification.

  publish-cargo:
    name: Publish Rust crate to crates.io
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-rust-core
      - build-python-wheel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set crate versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: .github/scripts/set-crate-version-from-tag.sh

      - name: Publish crate
        working-directory: ${{ env.RUST_CORE_DIR }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty --token "$CARGO_REGISTRY_TOKEN"

      - name: Publish MCP crate
        working-directory: ${{ env.RUST_MCP_DIR }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty --token "$CARGO_REGISTRY_TOKEN"

  publish-pypi:
    name: Publish Python wheels to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-python-wheel
    runs-on: ubuntu-24.04
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-release:
    name: Attach binaries to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-rust-core
      - build-python-wheel
      - build-vscode-extension
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Each binary was uploaded as its own artifact (rca_cli-<os>-<arch> and
      # supportfile_mcp-<os>-<arch>), each containing a single binary named
      # `rca_cli`/`rca_cli.exe` (or `supportfile_mcp`/`supportfile_mcp.exe`).
      # Download them into per-artifact subdirectories so the platform-specific
      # names are preserved.
      - name: Download binary artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: '{rca_cli,supportfile_mcp}-*'
          path: artifacts

      # Wheels and source crates already carry unique, version-bearing file
      # names, so they can be merged into single flat directories.
      - name: Download wheel artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: python-wheels-*
          path: wheels
          merge-multiple: true

      - name: Download crate artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: '{rust-crate,rust-mcp-crate}-*'
          path: crates
          merge-multiple: true

      # VSIX packages already carry the platform target in their file name.
      - name: Download VSIX artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: vscode-extension-*
          path: vsix
          merge-multiple: true

      # Flatten into release-assets/ using the artifact name (which encodes
      # os+arch) as the asset name for binaries, appending `.exe` for Windows
      # binaries. Wheels (*.whl), source crates (*.crate), and VSIX packages
      # (*.vsix) are copied as-is.
      - name: Stage release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            for f in "$dir"*; do
              case "$(basename "$f")" in
                *.exe) ext='.exe' ;;
                *) ext='' ;;
              esac
              cp "$f" "release-assets/${name}${ext}"
            done
          done
          for f in wheels/*.whl crates/*.crate vsix/*.vsix; do
            cp "$f" "release-assets/$(basename "$f")"
          done
          echo "Release assets:"
          ls -la release-assets

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

  publish-vsce:
    name: Publish VS Code extension
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-vscode-extension
    runs-on: ubuntu-latest
    # Secrets are mapped to env so step-level `if` conditions can detect whether
    # they are configured. When a secret is absent it resolves to an empty
    # string, the matching publish step is skipped, and the job still succeeds.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: vscode-extension-*
          path: vsix
          merge-multiple: true

      - name: List VSIX packages
        run: ls -la vsix

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          set -euo pipefail
          # vsce can publish all platform-specific packages in one invocation.
          npx --yes @vscode/vsce publish --no-dependencies $(printf -- '--packagePath %s ' vsix/*.vsix)

      - name: Skip VS Code Marketplace (no VSCE_PAT)
        if: env.VSCE_PAT == ''
        run: echo "VSCE_PAT secret not set — skipping VS Code Marketplace publish."

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          set -euo pipefail
          for vsix in vsix/*.vsix; do
            npx --yes ovsx publish "$vsix" --pat "$OVSX_PAT"
          done

      - name: Skip Open VSX (no OVSX_PAT)
        if: env.OVSX_PAT == ''
        run: echo "OVSX_PAT secret not set — skipping Open VSX publish."
